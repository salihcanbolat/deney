name: Android

# Her push'ta kodu derler, birim ve ekran görüntüsü testlerini (Roborazzi, emülatörsüz) çalıştırır.
# APK ve emülatör denemesi yalnızca elle çalıştırılınca (kullanıcı telefonda denemek isteyince).
# Commit mesajında "[ekran]" varsa ekran görüntüleri docs/screenshots/android/ altına yazılır.

on:
  push:
    paths:
      - android/**
      - .github/workflows/android.yml
      - .github/scripts/kilit_ekrani.sh
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Derle, test et, ekran görüntüsü al
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Her push'ta yalnızca kod derlenir ve testler çalışır. APK yalnızca elle tetiklenince
      # (Actions → Android → Run workflow) üretilir.
      - name: Derle
        working-directory: android
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            ./gradlew --no-daemon --stacktrace compileDebugKotlin
          fi

      - name: Testler ve ekran görüntüleri
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: secim-anketi-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Test raporu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporu
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Ekran görüntülerini dala yaz
        if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ekran]'))
        run: |
          set -e
          OUT=docs/screenshots/android
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp -R build/screenshots/android/. "$OUT"/ 2>/dev/null || true
          {
            echo "Kaynak commit: $GITHUB_SHA"
            echo "Tarih (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Çizim: Robolectric + Roborazzi, 390 × 844 dp, xxhdpi"
            echo "CI çalıştırması: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$OUT/INFO.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots/android
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "CI: Android ekran görüntüleri (${GITHUB_SHA::7}) [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:refs/heads/$GITHUB_REF_NAME" && break; sleep 5; done

  # Gerçek emülatörde kilit ekranı bildirimi ve kilit açılmadan inceleme.
  # Commit mesajında "[kilit]" varsa ya da elle çalıştırılırsa çalışır (~10 dk).
  kilit-ekrani:
    name: Emülatörde kilit ekranı
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Emülatörde dene
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/kilit_ekrani.sh

      - name: Ekran görüntülerini dala yaz
        if: always()
        run: |
          set -e
          OUT=docs/screenshots/android-cihaz
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp -R build/screenshots/android-cihaz/. "$OUT"/ 2>/dev/null || true
          echo "Kaynak commit: $GITHUB_SHA · Emülatör: API 34, Pixel 6 · $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$OUT/INFO.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots/android-cihaz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "CI: emülatör kilit ekranı görüntüleri (${GITHUB_SHA::7}) [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:refs/heads/$GITHUB_REF_NAME" && break; sleep 5; done
