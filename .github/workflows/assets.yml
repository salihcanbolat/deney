name: Görseller

# Parti logolarını ve lider fotoğraflarını Wikimedia Commons'tan indirip asset kataloğuna yazar.
# tools/party_assets.json değiştiğinde ya da elle çalıştırıldığında çalışır.

on:
  push:
    paths:
      - tools/party_assets.json
      - tools/fetch_assets.py
  workflow_dispatch:

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fetch:
    name: Görselleri indir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: İndir
        run: python3 tools/fetch_assets.py

      - name: Dala yaz
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A App/Resources/Assets.xcassets/Parties
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "CI: parti logoları ve lider fotoğrafları [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
