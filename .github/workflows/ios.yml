name: iOS

# Her push'ta: PollCore testleri, derleme, birim/görüntü testleri ve simülatörde arayüz testi.
# Commit mesajında "[ekran]" varsa (ya da elle çalıştırılırsa) ekran görüntüleri ve video
# aynı dalda docs/screenshots/latest/ altına yazılır.

on:
  push:
    paths:
      - App/**
      - Packages/**
      - Tests/**
      - project.yml
      - .github/workflows/ios.yml
      - .github/scripts/pick_simulator.py
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: Derle, test et, ekran görüntüsü al
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      SHOTS: build/screenshots
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Xcode seç
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "XCODE_VERSION=$(xcodebuild -version | head -1)" >> "$GITHUB_ENV"

      - name: Projeyi üret (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: PollCore testleri
        run: swift test --package-path Packages/PollCore

      - name: Simülatörü hazırla
        run: |
          IFS='|' read -r UDID SIM_NAME SIM_OS <<< "$(python3 .github/scripts/pick_simulator.py)"
          echo "Simülatör: $SIM_NAME ($SIM_OS) $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "SIM_LABEL=$SIM_NAME, $SIM_OS" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          mkdir -p "$SHOTS"

      - name: Derle
        run: |
          xcodebuild build-for-testing \
            -project SecimAnketi.xcodeproj -scheme SecimAnketi \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Birim ve görüntü testleri
        run: |
          xcodebuild test-without-building \
            -project SecimAnketi.xcodeproj -scheme SecimAnketi \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/DerivedData \
            -only-testing:SecimAnketiTests \
            -resultBundlePath build/results/unit.xcresult -quiet

      - name: Arayüz testleri (ekran kaydıyla)
        run: |
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force "$SHOTS/demo.mov" &
          RECORDER=$!
          sleep 2
          set +e
          xcodebuild test-without-building \
            -project SecimAnketi.xcodeproj -scheme SecimAnketi \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/DerivedData \
            -only-testing:SecimAnketiUITests \
            -resultBundlePath build/results/ui.xcresult -quiet
          STATUS=$?
          kill -INT "$RECORDER"
          wait "$RECORDER"
          exit $STATUS

      - name: Videoyu küçült
        if: always()
        run: |
          if [ -f "$SHOTS/demo.mov" ]; then
            if avconvert --preset Preset1920x1080 --source "$SHOTS/demo.mov" --output "$SHOTS/demo.mp4" --replace; then
              rm "$SHOTS/demo.mov"
            fi
          fi
          ls -la "$SHOTS" || true

      - name: Ekran görüntülerini dala yaz
        if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ekran]'))
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -e
          OUT=docs/screenshots/latest
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp -R "$SHOTS"/. "$OUT"/ 2>/dev/null || true
          # Video büyük; yalnızca commit mesajında [video] varsa depoya yazılır.
          if ! echo "$COMMIT_MESSAGE" | grep -q "\[video\]"; then rm -f "$OUT"/demo.*; fi
          {
            echo "Kaynak commit: $GITHUB_SHA"
            echo "Tarih (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Xcode: $XCODE_VERSION"
            echo "Simülatör: $SIM_LABEL"
            echo "CI çalıştırması: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$OUT/INFO.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "CI: ekran görüntüleri (${GITHUB_SHA::7}) [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
