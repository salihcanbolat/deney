<style>
body{margin:0;background:#040714}
button{font:inherit;color:inherit;cursor:pointer}
@keyframes fade{from{opacity:0;transform:translateY(-6px) scale(.92)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,30px)}}
@keyframes wake{0%{box-shadow:0 0 0 0 rgba(91,135,255,0)}40%{box-shadow:0 0 0 3px rgba(91,135,255,0.45)}100%{box-shadow:0 0 0 0 rgba(91,135,255,0)}}
.fade{animation:fade .45s .1s cubic-bezier(.16,.84,.24,1) both}
.live{animation:pulse 2.4s ease-in-out infinite}
.drift{animation:drift 16s ease-in-out infinite}
.wake{animation:wake 1.2s .15s ease-out both}
.col{transition:height .6s cubic-bezier(.2,.9,.25,1.05),background-color .4s ease,border-color .4s ease,box-shadow .4s ease,transform .35s cubic-bezier(.2,.9,.25,1.2),opacity .4s ease}
.panel{transition:left .5s cubic-bezier(.2,.9,.25,1.05),right .5s cubic-bezier(.2,.9,.25,1.05)}
@keyframes tick{0%,86%,100%{filter:none}91%{filter:brightness(1.7) drop-shadow(0 0 4px rgba(143,174,255,0.9))}}
.tick{animation:tick 7s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>

      hasOpen: isOpen,
      cardBorder: isOpen ? 'rgba(91,135,255,0.35)' : 'rgba(255,255,255,0.08)',
      panelL: isOpen ? (right ? ((st.open + 1) * COL) + 'px' : '0px') : '0px',

        const el = document.elementFromPoint(e.clientX, e.clientY);

        const i = Number(t.getAttribute('data-i'));

      },

        clearTimeout(self.timer);
        if (self.state.holding) self.setState({ holding: false, open: null });
