<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Canlı Sonuçlar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1F5BD8}a:hover{color:#174AB3}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 430px; height: 884px; box-sizing: border-box; padding: 20px; background: #1C1C1E; border-radius: 68px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; color: #1C1C1E">
<div style="position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: #F2F2F7; display: flex; flex-direction: column">
<div aria-hidden="true" style="position: absolute; top: 11px; left: 135px; width: 120px; height: 35px; border-radius: 20px; background: #000000; z-index: 5"></div>

<div style="flex: none; box-sizing: border-box; padding: 56px 16px 10px; display: flex; flex-direction: column; gap: 10px">
  <div style="display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 600; color: #5E5E63">Örnek anket · temsili veriler</span>
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px">Canlı Sonuçlar</h1>
    </div>
    <a href="Candles.dc.html" style="display: inline-flex; align-items: center; gap: 5px; padding: 7px 10px; border-radius: 999px; background: #FFFFFF; font-size: 12.5px; font-weight: 700; text-decoration: none; min-height: 30px; box-sizing: border-box; box-shadow: 0 1px 2px rgba(0,0,0,0.06)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 4v16M17 4v16"></path><rect x="4.5" y="7" width="5" height="7" rx="1"></rect><rect x="14.5" y="10" width="5" height="6" rx="1"></rect></svg>Mum grafiği</a>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="padding: 9px 10px; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 11px; color: #5E5E63">Katılımcı</span><span style="font-size: 16px; font-weight: 800">128.460</span></div>
    <div style="padding: 9px 10px; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 11px; color: #5E5E63">Son 1 dakika</span><span style="font-size: 16px; font-weight: 800; color: #1F5BD8">+214 oy</span></div>
    <div style="padding: 9px 10px; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 11px; color: #5E5E63">Senin partin</span><span style="font-size: 16px; font-weight: 800">BHP · 3.</span></div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #5E5E63">
    <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #1F5BD8; box-shadow: 0 0 0 3px #D3E0FA"></span>Canlı · şimdi güncellendi</span>
    <span style="display: inline-flex; gap: 12px; font-weight: 600"><span style="color: #1A4FBF">Olumlu</span><span style="color: #9A4415">Olumsuz</span></span>
  </div>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 16px">
  <section aria-label="Partiler, en çok olumlu oydan en aza" style="border-radius: 18px; background: #FFFFFF; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.05)">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
      <div style="display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-bottom: 1px solid #ECECF0; background: {{r.bg}}">
        <span style="width: 22px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 1px">
          <span style="font-size: 13px; font-weight: 800">{{r.place}}</span>
          <span style="font-size: 9px; font-weight: 800; color: {{r.moveColor}}">{{r.moveTxt}}</span>
        </span>
        <span style="width: 32px; height: 32px; flex: none; border-radius: 50%; background: {{r.color}}; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{r.letter}}</span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; align-items: center; gap: 6px; min-width: 0">
            <span style="font-size: 14px; font-weight: 700">{{r.code}}</span>
            <span style="font-size: 11.5px; color: #5E5E63; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.leader}}</span>
            <sc-if value="{{r.mine}}" hint-placeholder-val="{{false}}"><span style="flex: none; padding: 2px 6px; border-radius: 6px; background: #1F5BD8; color: #FFFFFF; font-size: 9.5px; font-weight: 700">Senin partin</span></sc-if>
            <sc-if value="{{r.never}}" hint-placeholder-val="{{false}}"><span style="flex: none; padding: 2px 6px; border-radius: 6px; background: #FBF1EA; color: #9A4415; font-size: 9.5px; font-weight: 700">Asla</span></sc-if>
          </div>
          <div aria-hidden="true" style="height: 6px; border-radius: 3px; background: #EEF0F4; overflow: hidden"><span style="display: block; height: 6px; width: {{r.barW}}%; border-radius: 3px; background: #1F5BD8"></span></div>
        </div>
        <div style="width: 52px; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 1px">
          <span style="font-size: 14px; font-weight: 800; color: #1F5BD8">%{{r.posTxt}}</span>
          <span style="font-size: 11px; font-weight: 700; color: #9A4415">%{{r.negTxt}}</span>
        </div>
      </div>
    </sc-for>
  </section>
</div>

<nav aria-label="Ana menü" style="flex: none; height: 83px; box-sizing: border-box; padding: 7px 8px 0; background: #FBFBFD; border-top: 1px solid #D9D9DE; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
  <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #6B6B70; font-size: 10px; font-weight: 600; min-height: 44px">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"></rect></svg>Pusula</a>
  <a href="Vote.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #6B6B70; font-size: 10px; font-weight: 600; min-height: 44px">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><path d="M8 12.3l2.8 2.8L16.2 9.6"></path></svg>Oy Ver</a>
  <a href="Results.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #1F5BD8; font-size: 10px; font-weight: 600; min-height: 44px">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 20v-9M12 20V4M19 20v-6"></path></svg>Sonuçlar</a>
  <a href="Press.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #6B6B70; font-size: 10px; font-weight: 600; min-height: 44px">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="8" rx="2"></rect><rect x="3.5" y="14" width="7.5" height="6.5" rx="2"></rect><rect x="13" y="14" width="7.5" height="6.5" rx="2"></rect></svg>Pano</a>
</nav>
<div aria-hidden="true" style="position: absolute; bottom: 8px; left: 128px; width: 134px; height: 5px; border-radius: 3px; background: #1C1C1E"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":430,"height":884}}'>
var RAW = "YUP|Selin Arda|#2F5FD0|16.4|22.1;ADP|Kemal Tunç|#B0441A|15.9|23.8;BHP|Murat Ergin|#0E6F57|11.2|9.2;HLK|Ayşe Doğan|#B42D45|8.7|6.4;ÇEP|Deniz Kaya|#3B7F2A|6.3|3.1;GSP|Emre Yalın|#6A44C2|5.1|4.8;MİD|Hakan Sezer|#7A5C0F|4.4|7.9;ÖTP|Leyla Aksoy|#A8327A|3.8|2.2;KAP|Orhan Bilge|#1F6F8C|3.1|1.9;YDP|Nazlı Er|#276749|2.7|1.4;EGP|Tarık Uslu|#4B5BB5|2.4|2.6;SNA|Cengiz Özbek|#7A4A2A|2.1|1.7;TBP|Fatma Ilgaz|#586A12|1.9|1.1;GKP|Arda Soylu|#B83280|1.7|0.9;HAD|Zeynep Akalın|#34495E|1.5|1.3;DNZ|Barış Yüce|#0B6A8C|1.3|0.8;KYP|Gül Erkan|#A0522D|1.2|0.7;BİP|Onur Tekin|#5A3FA0|1.1|0.6;ÜRP|Sinan Polat|#8A3324|1.0|1.0;ÇAP|Pelin Ateş|#2B6CB0|0.9|1.5;YOP|Erdem Kılıç|#8C5A12|0.8|0.5;SİP|Hande Koç|#6B46C1|0.7|0.4;ESP|Yavuz Tan|#9C4221|0.7|0.6;KİP|Melis Yurt|#2C7A7B|0.6|0.3;OTP|Rıza Bozkurt|#744210|0.6|0.9;DÖP|Ece Turan|#9D2F6B|0.5|0.3;BYP|Kaan Eren|#4A5568|0.5|0.4;TEP|İpek Kalkan|#2C5282|0.4|0.2;ÇİP|Halil Duman|#556F1C|0.4|0.3;UYP|Sevgi Çınar|#97266D|0.4|0.5;AİP|Ahmet Gök|#975A16|0.3|0.4;GÜP|Selda Uz|#A3401A|0.3|0.2;DOP|İlker Saran|#22543D|0.3|0.2;MEP|Burcu Aydın|#553C9A|0.2|0.3;KUP|Ozan Çelik|#2A4365|0.2|0.1;GÖP|Nil Sarı|#9B2C2C|0.2|0.2;YEP|Şükrü Ak|#4C51BF|0.2|0.1;SÇP|Aslı Var|#5A6578|0.1|0.1;İDP|Ufuk Ser|#2F6B4F|0.1|0.1;BEP|Tuna Er|#822727|0.1|0.2";
function pct(v){ return v.toFixed(1).replace('.', ','); }
class Component extends DCLogic {
  renderVals() {
    var rows = RAW.split(';').map(function(r, i){
      var f = r.split('|'); var pos = parseFloat(f[3]), neg = parseFloat(f[4]);
      var m = i < 2 ? 0 : ((i * 7 + 3) % 5) - 2;
      return {
        place: i + 1, code: f[0], leader: f[1], color: f[2], letter: f[0].charAt(0),
        posTxt: pct(pos), negTxt: pct(neg), barW: (pos / 16.4 * 100).toFixed(1),
        moveTxt: m > 0 ? '▲' + m : (m < 0 ? '▼' + (-m) : '–'),
        moveColor: m > 0 ? '#1A4FBF' : (m < 0 ? '#9A4415' : '#6B6B70'),
        mine: f[0] === 'BHP', never: f[0] === 'ADP',
        bg: f[0] === 'BHP' ? '#EEF3FD' : '#FFFFFF'
      };
    });
    return { rows: rows };
  }
}
</script>
</body>
</html>
