<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Oy sandıkta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3F3596}a:hover{color:#2F2775}
button{font-family:inherit}
@keyframes drop{0%{transform:translateY(-70px) rotate(-6deg)}70%{transform:translateY(6px) rotate(-6deg)}100%{transform:translateY(0) rotate(-6deg)}}
</style>
</helmet>
<div style="width: 430px; height: 884px; box-sizing: border-box; padding: 20px; background: #0B0B0D; border-radius: 68px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; color: #1C1C1E">
<div style="position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: #F2F2F7; display: flex; flex-direction: column; align-items: center">
<div aria-hidden="true" style="position: absolute; top: 11px; left: 135px; width: 120px; height: 35px; border-radius: 20px; background: #000000; z-index: 5"></div>

<div role="img" aria-label="Zarf sandığa atılıyor" style="position: relative; margin-top: 96px; width: 220px; height: 218px">
  <span style="position: absolute; left: 60px; top: 6px; width: 100px; height: 64px; border-radius: 3px; background: #D6BC8E; box-shadow: 0 6px 14px rgba(60,40,10,0.18); overflow: hidden; z-index: 1; animation: drop 900ms cubic-bezier(.2,.8,.2,1) both">
    <span style="position: absolute; left: 0; right: 0; top: 0; height: 34px; background: #CBAE7C; clip-path: polygon(0 0, 100% 0, 50% 100%)"></span>
    <span style="position: absolute; left: 41px; top: 33px; width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px #3F3596; opacity: 0.85"></span>
  </span>
  <span style="position: absolute; left: 12px; top: 74px; width: 196px; height: 18px; border-radius: 7px 7px 3px 3px; background: #2C2C2E; z-index: 2"></span>
  <span style="position: absolute; left: 74px; top: 81px; width: 72px; height: 4px; border-radius: 2px; background: #000000; z-index: 3"></span>
  <span style="position: absolute; left: 18px; top: 92px; width: 184px; height: 122px; border-radius: 2px 2px 16px 16px; background: rgba(255,255,255,0.72); box-shadow: inset 0 0 0 1px #C7C7CC, 0 10px 24px rgba(0,0,0,0.06); overflow: hidden; z-index: 2">
    <span style="position: absolute; left: 22px; bottom: 12px; width: 80px; height: 50px; border-radius: 3px; background: #E1CCA4; transform: rotate(7deg)"></span>
    <span style="position: absolute; left: 82px; bottom: 8px; width: 82px; height: 52px; border-radius: 3px; background: #D4B88A; transform: rotate(-5deg)"></span>
    <span style="position: absolute; left: 50px; bottom: 30px; width: 76px; height: 48px; border-radius: 3px; background: #EADBBB; transform: rotate(-12deg)"></span>
  </span>
</div>

<div style="margin-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 0 32px">
  <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.3px">Oyun sandıkta</h1>
  <span style="font-size: 15px; line-height: 1.4; color: #6D6D72">Tercihin anonim olarak Genel Seçim Anketi sonuçlarına eklendi.</span>
</div>

<section style="margin-top: 24px; width: 358px; border-radius: 14px; background: #FFFFFF; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 16px; min-height: 48px; box-shadow: inset 0 -0.5px 0 #D8D8DD">
    <span style="flex: 1; font-size: 17px">Parti</span>
    <span style="font-size: 17px; color: #6D6D72">BHP</span>
    <span style="padding: 2px 7px; border-radius: 10px; box-shadow: inset 0 0 0 1.5px #3F3596; color: #3F3596; font-size: 11px; font-weight: 800; letter-spacing: 0.8px">EVET</span>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 16px; min-height: 48px; box-shadow: inset 0 -0.5px 0 #D8D8DD">
    <span style="flex: 1; font-size: 17px">Lider</span>
    <span style="font-size: 17px; color: #6D6D72">Murat Ergin</span>
    <span style="padding: 2px 7px; border-radius: 10px; box-shadow: inset 0 0 0 1.5px #3F3596; color: #3F3596; font-size: 11px; font-weight: 800; letter-spacing: 0.8px">EVET</span>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 16px; min-height: 48px">
    <span style="flex: 1; font-size: 17px">Asla</span>
    <span style="font-size: 17px; color: #6D6D72">ADP</span>
    <span style="padding: 2px 7px; border-radius: 10px; box-shadow: inset 0 0 0 1.5px #3F3596; color: #3F3596; font-size: 11px; font-weight: 800; letter-spacing: 0.8px">ASLA</span>
  </div>
</section>

<section style="margin-top: 16px; width: 358px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 52px; border-radius: 14px; background: #FFFFFF">
  <span style="flex: 1; font-size: 17px">Kilit ekranında takip et</span>
  <button type="button" onClick="{{toggle}}" aria-pressed="{{on}}" aria-label="Kilit ekranında takip et" style="width: 51px; height: 31px; flex: none; border: none; border-radius: 16px; padding: 2px; background: {{trackBg}}; cursor: pointer; display: flex; justify-content: {{knobSide}}; transition: background 200ms ease">
    <span style="width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 3px 8px rgba(0,0,0,0.15), 0 0 0 0.5px rgba(0,0,0,0.04)"></span>
  </button>
</section>

<a href="LockRest.dc.html" style="position: absolute; bottom: 40px; left: 16px; right: 16px; height: 50px; border-radius: 14px; background: #3F3596; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center">Kilit ekranında gör</a>
<div aria-hidden="true" style="position: absolute; bottom: 8px; left: 128px; width: 134px; height: 5px; border-radius: 3px; background: #1C1C1E"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":430,"height":884}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var on = (this.state && this.state.on !== undefined) ? this.state.on : true;
    return {
      on: on, trackBg: on ? '#34C759' : '#E3E3E8', knobSide: on ? 'flex-end' : 'flex-start',
      toggle: function(){ self.setState({ on: !on }); }
    };
  }
}
</script>
</body>
</html>
